name: Build & Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        type: choice
        default: "pre"
        options:
          - ci
          - pre
          - release
      tag:
        description: "Tag name (e.g. v1.0.0; leave blank to auto-generate)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine mode and version
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VER_CODE="$(date -u +%s)"

          # Derive base semver (vX.Y.Z) from module/module.prop (e.g. v0.3.0-pre.1 -> v0.3.0)
          PROP_VER="$(grep -E '^version=' module/module.prop | head -n1 | cut -d= -f2-)"
          BASE_VER="${PROP_VER%%-*}"
          [[ "$BASE_VER" == v* ]] || BASE_VER="v${BASE_VER:-0.1.0}"

          # If BASE_VER was already published as a full release tag, bump patch (vX.Y.Z -> vX.Y.(Z+1))
          while git rev-parse -q --verify "refs/tags/${BASE_VER}" >/dev/null 2>&1; do
            IFS='.' read -r MAJ MIN PAT <<< "${BASE_VER#v}"
            BASE_VER="v${MAJ}.${MIN}.$(( ${PAT:-0} + 1 ))"
          done

          next_pre_tag() {
            local max_n=0 n
            for t in $(git tag -l "${BASE_VER}-pre.*"); do
              n="${t##*-pre.}"
              if [[ "$n" =~ ^[0-9]+$ ]] && (( n > max_n )); then
                max_n="$n"
              fi
            done
            echo "${BASE_VER}-pre.$((max_n + 1))"
          }

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
            TAG="${{ inputs.tag }}"
            if [[ -z "$TAG" ]]; then
              if [[ "$MODE" == "release" ]]; then
                TAG="${BASE_VER}"
              elif [[ "$MODE" == "pre" ]]; then
                TAG="$(next_pre_tag)"
              else
                TAG="${BASE_VER}-ci.${GITHUB_RUN_NUMBER}.${SHORT_SHA}"
              fi
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            MODE="ci"
            TAG="${BASE_VER}-pr.${GITHUB_RUN_NUMBER}.${SHORT_SHA}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            if [[ "$TAG" == *-* ]]; then
              MODE="pre"
            else
              MODE="release"
            fi
          else
            # Every push to main deploys a pre-release automatically
            MODE="pre"
            TAG="$(next_pre_tag)"
          fi

          ZIP_NAME="rkp-mfr-auto-${TAG}.zip"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VER_CODE}" >> "$GITHUB_OUTPUT"

      - name: Build Zygisk native libraries
        run: |
          NDK_BIN=""
          if [[ -n "${ANDROID_NDK_HOME:-}" && -x "${ANDROID_NDK_HOME}/ndk-build" ]]; then
            NDK_BIN="${ANDROID_NDK_HOME}/ndk-build"
          elif [[ -n "${ANDROID_NDK_LATEST_HOME:-}" && -x "${ANDROID_NDK_LATEST_HOME}/ndk-build" ]]; then
            NDK_BIN="${ANDROID_NDK_LATEST_HOME}/ndk-build"
          else
            NDK_BIN="$(find /usr/local/lib/android/sdk/ndk -maxdepth 2 -name ndk-build -type f 2>/dev/null | sort -V | tail -n1)"
          fi
          if [[ -z "$NDK_BIN" ]]; then
            echo "Android NDK ndk-build not found" >&2
            exit 1
          fi
          echo "Using NDK: $NDK_BIN"
          "$NDK_BIN" -C zygisk NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk -j"$(nproc)"
          mkdir -p module/zygisk
          cp zygisk/libs/arm64-v8a/librkp_mfr_auto.so module/zygisk/arm64-v8a.so
          cp zygisk/libs/armeabi-v7a/librkp_mfr_auto.so module/zygisk/armeabi-v7a.so
          sha256sum zygisk/jni/main.cpp zygisk/jni/zygisk.hpp zygisk/jni/Android.mk zygisk/jni/Application.mk > module/zygisk/src.sha256
          ls -lh module/zygisk/

      - name: Stamp module.prop and build flashable ZIP
        run: |
          sed -i "s/^version=.*/version=${{ steps.meta.outputs.tag }}/" module/module.prop
          sed -i "s/^versionCode=.*/versionCode=${{ steps.meta.outputs.version_code }}/" module/module.prop
          chmod 755 module/post-fs-data.sh module/service.sh module/META-INF/com/google/android/update-binary
          (cd module && zip -r9 "../${{ steps.meta.outputs.zip_name }}" .)
          unzip -l "${{ steps.meta.outputs.zip_name }}"

      - name: Upload flashable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: rkp-mfr-auto-zip
          path: ${{ steps.meta.outputs.zip_name }}

      - name: Publish Pre-Release
        if: steps.meta.outputs.mode == 'pre'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          ZIP="${{ steps.meta.outputs.zip_name }}"

          bash .github/scripts/gen_changelog.sh pre "$TAG" "${GITHUB_SHA}" > /tmp/release_notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --notes-file /tmp/release_notes.md
          else
            gh release create "$TAG" "$ZIP" \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --title "RKP Manufacturer Auto-Match ${TAG}" \
              --notes-file /tmp/release_notes.md
          fi

      - name: Publish Full Release
        if: steps.meta.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          ZIP="${{ steps.meta.outputs.zip_name }}"

          bash .github/scripts/gen_changelog.sh release "$TAG" "${GITHUB_SHA}" > /tmp/release_notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --prerelease=false --notes-file /tmp/release_notes.md
          else
            gh release create "$TAG" "$ZIP" \
              --target "${GITHUB_SHA}" \
              --title "RKP Manufacturer Auto-Match ${TAG}" \
              --notes-file /tmp/release_notes.md
          fi

      - name: Update update.json and changelog.md (Release only)
        if: steps.meta.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VER_CODE="${{ steps.meta.outputs.version_code }}"
          ZIP="${{ steps.meta.outputs.zip_name }}"
          REPO="${GITHUB_REPOSITORY}"

          git checkout main
          git pull --ff-only origin main

          cat > update.json <<EOF
          {
            "version": "${TAG}",
            "versionCode": ${VER_CODE},
            "zipUrl": "https://github.com/${REPO}/releases/download/${TAG}/${ZIP}",
            "changelog": "https://raw.githubusercontent.com/${REPO}/main/changelog.md"
          }
          EOF

          NOTES=$(gh release view "$TAG" --json body --jq '.body')
          {
            echo "# ${TAG}"
            echo ""
            echo "${NOTES}"
          } > changelog.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json changelog.md
          git diff --cached --quiet || git commit -m "update.json: ${TAG} [skip ci]"
          git push origin main
