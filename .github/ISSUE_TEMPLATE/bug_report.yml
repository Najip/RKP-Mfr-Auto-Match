name: Bug report
description: Something not working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Fill the required fields or I can't help much. Turn on Debug log in Settings first, reproduce the problem, then tap **Report Issue** in Settings (or export the log) to pre-fill this form.
        Only tested with OhMyKeymint (TEE engine and PIF engine). Reports from other keystore setups are welcome.
  - type: input
    id: version
    attributes:
      label: Module version
      description: Shown on the Home tab, e.g. v0.4.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and ROM
      placeholder: Xiaomi 14T Pro, HyperOS 3, Android 15
    validations:
      required: true
  - type: input
    id: root
    attributes:
      label: Root manager and version
      placeholder: KernelSU / KernelSU Next / FinaSU / SukiSU / APatch / Magisk
    validations:
      required: true
  - type: input
    id: zygisk
    attributes:
      label: Zygisk backend
      description: What the Home tab indicator says
      placeholder: BreZygisk, ReZygisk, Zygisk Next, FolkZygisk (built-in), ...
    validations:
      required: true
  - type: input
    id: tee
    attributes:
      label: Keystore / TEE / PIF setup
      placeholder: OhMyKeymint (TEE + PIF), TrickyStore, TEESimulator, ...
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Also say what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Diagnostic / Debug log
      description: Pre-filled by Report Issue in Settings, or paste / attach the exported file (rkp_mfr_auto_log_*.txt). Required.
      render: text
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Affected app package
      description: Only if one app is the problem
      placeholder: com.example.app
  - type: checkboxes
    id: context
    attributes:
      label: Extra context
      options:
        - label: Debug log was enabled when reproducing
        - label: Affected app is in the whitelist
        - label: Possible conflicts shown on Home tab
  - type: input
    id: without
    attributes:
      label: Same result with the module disabled?
      placeholder: yes / no / didn't test
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, Duck Detector output, etc.
