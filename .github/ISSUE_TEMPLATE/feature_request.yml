name: Feature request
description: Suggest something
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What do you want
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why / what problem it solves
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
